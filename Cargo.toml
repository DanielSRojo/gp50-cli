[package]
name = "gp50"
version = "0.2.0"
edition = "2024"
description = "Read, inspect, edit and write Valeton GP-50 presets over USB MIDI"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
midir = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
